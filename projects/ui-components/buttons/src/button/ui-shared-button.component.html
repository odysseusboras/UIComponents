<ng-template #content>
  <ui-shared-button-content [icon]="icon()" [iconEnd]="iconEnd()" [labelKey]="labelKey()" [label]="label()"
                            [loading]="loading()" [loadingKey]="loadingKey()">
    <ng-content />
  </ui-shared-button-content>
</ng-template>

@if (routerLink(); as link) {
  <a [class]="classes" [routerLink]="link" [queryParams]="queryParams()" [attr.aria-disabled]="isDisabled || null" [attr.tabindex]="isDisabled ? -1 : null"
     [matTooltip]="tooltipKey() ? (tooltipKey() | uiTranslate) : ''">
    <ng-container *ngTemplateOutlet="content" />
  </a>
} @else {
  <button [type]="type()" [class]="classes" [disabled]="isDisabled"
          [matTooltip]="tooltipKey() ? (tooltipKey() | uiTranslate) : ''">
    <ng-container *ngTemplateOutlet="content" />
  </button>
}
