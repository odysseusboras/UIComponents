<ng-template #body>
  <div class="ui-shared-stat-tile__icon" [attr.data-tone]="tone() || null"><mat-icon>{{ icon() }}</mat-icon></div>
  <div class="ui-shared-stat-tile__body">
    <div class="ui-shared-stat-tile__label">{{ label() }}</div>
    <div class="ui-shared-stat-tile__value" [attr.data-tone]="tone() || null">
      @if (loading()) {
        <mat-progress-spinner mode="indeterminate" diameter="20" />
      } @else if (value() !== null && value() !== undefined && value() !== '') {
        {{ value() }}
      } @else {
        <span class="ui-shared-stat-tile__empty">—</span>
      }
    </div>
    @if (!loading()) {
      <div class="ui-shared-stat-tile__sub"><ng-content /></div>
    }
  </div>
  @if (link()) {
    <mat-icon class="ui-shared-stat-tile__arrow">chevron_right</mat-icon>
  }
</ng-template>

@if (link(); as l) {
  <a class="ui-shared-stat-tile" [routerLink]="l" [queryParams]="queryParams()">
    <ng-container [ngTemplateOutlet]="body" />
  </a>
} @else {
  <div class="ui-shared-stat-tile ui-shared-stat-tile--static">
    <ng-container [ngTemplateOutlet]="body" />
  </div>
}
