@if (iconOnly()) {
  <mat-icon class="ui-shared-hint__icon" [matTooltip]="resolved()" matTooltipPosition="above">{{ icon() }}</mat-icon>
} @else {
  <mat-icon class="ui-shared-hint__icon" aria-hidden="true">{{ icon() }}</mat-icon>
  <span class="ui-shared-hint__text" [matTooltip]="clamped() ? resolved() : ''" matTooltipPosition="above"
        [matTooltipDisabled]="!clamped()">@if (textKey() || text()) { {{ resolved() }} } @else { <ng-content /> }</span>
}
