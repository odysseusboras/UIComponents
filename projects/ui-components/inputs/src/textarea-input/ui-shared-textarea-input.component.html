<mat-form-field appearance="outline" [subscriptSizing]="subscriptSizing()">
  <mat-label>{{ labelKey() | uiTranslate }}</mat-label>
  <textarea matInput [formControl]="control()" [rows]="rows()" [required]="required()" [readonly]="readonly()"
            [attr.maxlength]="maxlength()"></textarea>
  @if (hintText() || hintKey()) {
    <ui-shared-hint matIconSuffix iconOnly [text]="hintText() || (hintKey() | uiTranslate)" />
  }
  @if (firstError(control()); as key) {
    <mat-error><ui-shared-hint tone="danger" [text]="key | uiTranslate" /></mat-error>
  }
</mat-form-field>
